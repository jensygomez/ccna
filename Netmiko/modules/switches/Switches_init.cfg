! Netmiko/modules/switches/Switches_init.cfg
enable

configure terminal

! --- Habilitar LLDP (útil para descubrir vecinos)
lldp run

! --- Crear usuario para autenticación local
username Sw-02-112 privilege 15 secret Sw-02-112

! --- Configurar la interfaz VLAN de administración
interface vlan 1
 ip address 192.168.0.112 255.255.255.0
 no shutdown

! --- Definir la puerta de enlace (Bastion, en tu caso 192.168.0.1)
ip default-gateway 192.168.0.1

! --- Configurar acceso por Telnet y/o SSH
line vty 0 4
 login local
 transport input telnet ssh

! --- (Recomendado) Habilitar contraseña de enable
enable secret Sw-02-112

end
write memory
